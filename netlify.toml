# kismet-ux.com — Netlify deploy configuration

[build]
  command = "yarn build"
  publish = "build"

[build.environment]
  # Vite 7 requires Node 20.19+ / 22.12+. Yarn 4 comes from the
  # "packageManager" field in package.json via corepack.
  NODE_VERSION = "22"

# Single-page app: react-router owns the routes, so every path that isn't a
# real file must serve index.html or deep links (e.g. /process) 404.
# Must stay LAST — redirects are evaluated in order.
[[headers]]
  for = "/assets/*"
  [headers.values]
    # Vite fingerprints these filenames, so they can be cached forever.
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
