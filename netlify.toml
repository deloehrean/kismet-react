# kismet-ux.com — Netlify deploy configuration

[build]
  command = "yarn build"
  publish = "build"

[build.environment]
  # Vite 7 requires Node 20.19+ / 22.12+. Yarn 4 comes from the
  # "packageManager" field in package.json via corepack.
  NODE_VERSION = "22"

[[headers]]
  for = "/assets/*"
  [headers.values]
    # Vite fingerprints these filenames, so they can be cached forever.
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# --- Redirects are evaluated top to bottom; the SPA catch-all MUST stay last. ---

# A real file always wins over a redirect, so this only fires for assets that
# do NOT exist. Without it the catch-all below answers every missing image,
# font or PDF with 200 + index.html, which browsers then try to decode as the
# requested media type.
[[redirects]]
  from = "/assets/*"
  to = "/404.html"
  status = 404

# Single-page app: react-router owns the routes, so any path that isn't a real
# file serves index.html, letting the client render the route (or its own 404).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
